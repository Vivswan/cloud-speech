name: Feature or provider request
description: Suggest a new feature, improvement, or text-to-speech provider
labels: [enhancement]
body:
  - type: dropdown
    id: kind
    attributes:
      label: What kind of request is this?
      options:
        - New feature
        - New TTS provider
        - Improvement to an existing feature
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: |
        What are you trying to do that you can't today? For a new provider:
        which service, and does it offer a public API with per-user credentials?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered (optional)
      description: Workarounds you've tried, or other designs you ruled out.
    validations:
      required: false
