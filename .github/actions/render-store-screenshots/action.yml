name: Render the store screenshots
description: |
  Renders the store-listing screenshot sets into apps/extension/.output/store-screenshots, one directory per locale.

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: .bun-version

    - name: Install dependencies
      run: bun install --frozen-lockfile
      shell: bash

    # The same cache as checks.yml's smoke job: the Chromium download has outrun a job cap on a slow mirror; cached,
    # `playwright install` finds the browser and only installs the system packages.
    - name: Resolve the Playwright version
      id: playwright
      run: echo "version=$(bunx playwright --version | sed 's/^Version //')" >> "$GITHUB_OUTPUT"
      shell: bash
      working-directory: apps/extension

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

    - name: Install Playwright Chromium
      run: bunx playwright install chromium --with-deps
      shell: bash
      working-directory: apps/extension

    # The popup's bundled Inter has no Devanagari or Han glyphs, so those scripts fall back to the runner's fonts, and
    # Playwright's --with-deps fonts alone give zh-TW a Simplified-styled face.
    #
    #   hi            -> FreeSans, fontconfig's pick on the runner even with fonts-noto-core installed
    #   zh-cn, zh-tw  -> Noto Sans CJK SC or TC from fonts-noto-cjk, picked by the page's language
    - name: Install the fallback fonts for Devanagari and Han
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends fonts-noto-core fonts-noto-cjk
        for lang in hi zh-cn zh-tw; do
          echo "sans-serif:lang=$lang -> $(fc-match "sans-serif:lang=$lang")"
        done

    # No secrets: the e2e fake speech server on loopback stands in for a provider.
    - name: Render the store screenshots
      run: bun run screenshots:store
      shell: bash
