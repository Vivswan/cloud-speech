name: Render the store screenshots
description: |
  Renders the store-listing screenshot sets into apps/extension/.output/store-screenshots, one directory per locale.

  Both renders run through this action, so they cannot drift: post-green.yml uploads the sets from green main, and
  checks.yml renders them on a pull request that can change them.

  Bun comes from .bun-version, then the dependencies and Playwright's Chromium with its system packages, so the caller
  needs only a checkout.

  The popup's bundled Inter has no Devanagari or Han glyphs, so those scripts render from the runner's fonts.

  Han renders from Noto Sans CJK, SC or TC by the page's language, which the fonts-noto-cjk package pins as a Linux
  Chrome does.

  Devanagari renders from FreeSans, the face fontconfig picks for hi on the runner. The Noto package is installed for
  Han.

  The fc-match lines log each pick, so a font drift is visible in the job log.

  No secrets: the e2e fake speech server on loopback stands in for a provider. The action calls no GitHub API and needs
  no token or permission grant from the caller.

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: .bun-version

    - name: Install dependencies
      run: bun install --frozen-lockfile
      shell: bash

    - name: Install Playwright Chromium
      run: bunx playwright install chromium --with-deps
      shell: bash
      working-directory: apps/extension

    # Playwright's --with-deps fonts alone give a Simplified-styled pan-CJK face for zh-TW.
    - name: Install the fallback fonts for Devanagari and Han
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends fonts-noto-core fonts-noto-cjk
        for lang in hi zh-cn zh-tw; do
          echo "sans-serif:lang=$lang -> $(fc-match "sans-serif:lang=$lang")"
        done

    - name: Render the store screenshots
      run: bun run screenshots:store
      shell: bash
