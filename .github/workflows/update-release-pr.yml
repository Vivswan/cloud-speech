# Repo-owned: generated once by the fleet sync, never overwritten by it. The managed ci.yml's `update-release-pr` job
# calls this whenever its `release` leg creates or refreshes the release PR; releases never wait on this path, so add jobs freely.
# Real work here checks out `inputs.head_branch` and pushes back to it. The token decides whether that push re-runs the PR's checks:
#   a push to the PR branch with github.token          -> does NOT re-trigger the PR's checks; it needs a manual close/reopen to pass all-green
#   the same push with the REPO_PLATFORM_TOKEN PAT     -> re-triggers them

name: Update Release PR

on:
  workflow_call:
    inputs:
      pr_number:
        description: The release PR's number
        required: true
        type: string
      head_branch:
        description: The release PR's head branch (push updates back to it)
        required: true
        type: string

jobs:
  update-release-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Nothing here reads the repository or pushes yet, so no step consumes a token and the job grants no permission until one does.
    permissions: {}
    steps:
      - name: Update the release PR
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        # Repository-specific release-PR preparation (regenerated files, version references) replaces this echo.
        run: echo "nothing to add to release PR $PR_NUMBER yet"
