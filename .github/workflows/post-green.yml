# Repo-owned: generated once by the fleet sync, never overwritten by it; the contract is the fleet's docs/all-green.md, "After the gate".
# Jobs here see the LATEST green main, not every commit (ci.yml's concurrency group drops a superseded pending run), so act on
# the repository's current state and stay idempotent.
#   all-green gate -> post-green (this file), on every green push to main -> release

name: Post Green

on:
  workflow_call:
    inputs:
      sha:
        description: The green main commit the calling run judged.
        required: true
        type: string

jobs:
  # The store screenshots are never committed to main: this is the render that publishes them, and the release leg needs
  # it, so a failed render blocks the release. checks.yml renders the same sets on a pull request that can change them,
  # through the same action, and uploads nothing.
  #   this job -> store-screenshots-<sha> artifact -> publish-screenshots.yml, once the WHOLE run is green (no job inside a run sees that) -> orphan store-screenshots branch
  store-screenshots:
    name: render the store screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - uses: ./.github/actions/render-store-screenshots

      # publish-screenshots.yml downloads this artifact by name, with the CI run's head sha, and expects one <locale>/ directory per set.
      - name: Upload the screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: store-screenshots-${{ inputs.sha }}
          path: apps/extension/.output/store-screenshots/
          if-no-files-found: error
          retention-days: 90
