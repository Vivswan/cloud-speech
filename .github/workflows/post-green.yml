# Repo-owned: generated once by Vivswan/repo-platform, never
# overwritten by sync. Called after the all-green gate on every green push
# to main, before the release (the contract is in repo-platform's
# docs/all-green.md, "After the gate"). Jobs here run for the LATEST green
# main, not every commit (ci.yml's concurrency group cancels a superseded
# pending run): act on the repository's current state, never on "what this
# commit changed", and stay idempotent.

name: Post Green

on:
  workflow_call:
    inputs:
      sha:
        description: The green main commit the calling run judged.
        required: true
        type: string

jobs:
  # The store-listing screenshots (docs/store-listing.md, "Screenshots") are
  # never committed to main: this job renders them from the green commit and
  # keeps them as an artifact. Rendering needs only the built extension and
  # the e2e fake speech server on loopback: no secrets. This is the only
  # render: once the CI run is green, publish-screenshots.yml copies this
  # artifact to the orphan `store-screenshots` branch (the managed caller caps
  # GITHUB_TOKEN here at contents: read, so the push cannot happen in this
  # job). The release leg of the same run needs this job, so a failed render
  # blocks the release before anything publishes.
  store-screenshots:
    name: render the store screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install chromium --with-deps
        working-directory: apps/extension

      # The popup bundles Inter, which has no Devanagari or Han glyphs, so the
      # Hindi and Chinese sets take those from the runner's fonts through
      # fontconfig. The fonts Playwright's --with-deps installs would give
      # them a Simplified-styled pan-CJK face for Traditional Chinese and a
      # bitmap-like face for Devanagari; Noto Sans Devanagari (fonts-noto-core)
      # and Noto Sans CJK (fonts-noto-cjk, one face per region, which
      # fontconfig picks by the page's language) make the render deterministic
      # and are what a Linux Chrome shows. The fc-match lines record which
      # face each script fell back to, so a font drift is visible in the log.
      - name: Install the fallback fonts for Devanagari and Han
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-core fonts-noto-cjk
          for lang in hi zh-cn zh-tw; do
            echo "sans-serif:lang=$lang -> $(fc-match "sans-serif:lang=$lang")"
          done

      # Builds the Chrome extension, then renders every scene once per
      # language the extension ships (about a minute each, one after another)
      # and writes two files from each, the 1280 x 800 store crop and the
      # 2560 x 1600 composition, plus crops.json with each crop's window in
      # its composition, under <locale>/ (docs/store-listing.md). Exits
      # non-zero on a failed scene or a file of the wrong size.
      - name: Render the store screenshots
        run: bun run screenshots:store

      # The name publish-screenshots.yml downloads by (head sha of the CI run);
      # the artifact holds the <locale>/ directories.
      - name: Upload the screenshots
        uses: actions/upload-artifact@v7
        with:
          name: store-screenshots-${{ inputs.sha }}
          path: apps/extension/.output/store-screenshots/
          if-no-files-found: error
          retention-days: 90
