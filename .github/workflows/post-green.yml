# Repo-owned: generated once by the fleet sync, never overwritten by it; the contract is the fleet's docs/all-green.md, "After the gate".
# Jobs here see the LATEST green main, not every commit (ci.yml's concurrency group drops a superseded pending run), so act on
# the repository's current state and stay idempotent.
#   all-green gate -> post-green (this file), on every green push to main -> release

name: Post Green

on:
  workflow_call:
    inputs:
      sha:
        description: The green main commit the calling run judged.
        required: true
        type: string

jobs:
  # The store screenshots are never committed to main: this is their only render, and the release leg needs it, so a
  # failed render blocks the release. No secrets: the e2e fake speech server on loopback stands in for a provider.
  #   this job -> store-screenshots-<sha> artifact -> publish-screenshots.yml, once the WHOLE run is green (no job inside a run sees that) -> orphan store-screenshots branch
  store-screenshots:
    name: render the store screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install chromium --with-deps
        working-directory: apps/extension

      # The popup's bundled Inter has no Devanagari or Han glyphs, so those scripts render from the runner's fonts through
      # fontconfig; the Noto packages pin which face, matching a Linux Chrome. The fc-match lines log the pick, so a font drift is visible.
      #   Playwright's --with-deps fonts only -> Simplified-styled pan-CJK face for zh-TW, bitmap-like face for Devanagari
      #   fonts-noto-core + fonts-noto-cjk    -> Noto Sans Devanagari; Noto Sans CJK, one face per region, chosen by the page's language
      - name: Install the fallback fonts for Devanagari and Han
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-core fonts-noto-cjk
          for lang in hi zh-cn zh-tw; do
            echo "sans-serif:lang=$lang -> $(fc-match "sans-serif:lang=$lang")"
          done

      - name: Render the store screenshots
        run: bun run screenshots:store

      # publish-screenshots.yml downloads this artifact by name, with the CI run's head sha, and expects one <locale>/ directory per set.
      - name: Upload the screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: store-screenshots-${{ inputs.sha }}
          path: apps/extension/.output/store-screenshots/
          if-no-files-found: error
          retention-days: 90
