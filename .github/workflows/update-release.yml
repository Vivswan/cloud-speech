# Repo-owned: generated once by the fleet sync, never overwritten by it. Add jobs freely: the managed ci.yml's
# `publish-release` leg waits for every job here, and its `pages` leg deploys the site after that.
#   release (draft cut) -> update-release (this file) -> publish-release (attests the assets, flips the draft live) -> pages (serves the new tag)

name: Update Release

on:
  workflow_call:
    inputs:
      tag:
        description: The draft release's tag (forced at creation, so it is checkout-able before publication)
        required: true
        type: string

jobs:
  update-release:
    name: build zips, upload, publish to store
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # upload assets; also what makes the draft visible to gh
    steps:
      # Check out the TAG, not main's head: the zips must be the released source even if main moved on since.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build store zips (chrome + firefox)
        run: bun run build:chrome && bun run build:firefox

      - name: Verify store zips (version, name, no dev key)
        run: bun run verify:zips

      # ci.yml's publish-release leg attests every asset uploaded here into one attestation.json (public repositories only).
      #   gh attestation verify <zip> -R <owner>/<repo> --bundle attestation.json
      - name: Upload zips to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          ls -la apps/extension/.output/*.zip
          gh release upload "$TAG" apps/extension/.output/*.zip --clobber

      # One chrome zip, two listing IDs: the Polly listing was renamed in place to "Cloud Speech", and the old Azure
      # listing keeps receiving the same build so its installs stay current. Both listings share one CWS OAuth app.
      # Docs: https://wxt.dev/guide/essentials/publishing
      - name: Publish to the Chrome Web Store (configured listing IDs)
        env:
          CHROME_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_ID_POLLY: ${{ secrets.CWS_EXTENSION_ID_POLLY }}
          CWS_ID_AZURE: ${{ secrets.CWS_EXTENSION_ID_AZURE }}
        working-directory: apps/extension
        run: |
          if [ -z "$CHROME_CLIENT_ID" ] || [ -z "$CHROME_CLIENT_SECRET" ] || [ -z "$CHROME_REFRESH_TOKEN" ]; then
            echo "::notice::CWS_* secrets not fully configured; zips attached to the GitHub release only."
            exit 0
          fi
          version="$(node -p "require('../../package.json').version")"
          # The zip name pattern lives only in wxt.config.ts, so glob by suffix; verify:zips already asserted exactly one match.
          chrome_zip=$(ls .output/*-"${version}"-chrome.zip)
          for listing in polly azure; do
            id_var="CWS_ID_$(echo "$listing" | tr '[:lower:]' '[:upper:]')"
            extension_id="${!id_var}"
            if [ -z "$extension_id" ]; then
              echo "::notice::No extension id secret for $listing; skipping that listing."
              continue
            fi
            echo "Publishing $listing listing ($extension_id)..."
            CHROME_EXTENSION_ID="$extension_id" \
              bunx wxt submit --chrome-zip "$chrome_zip"
          done

      # This step updates an existing AMO listing, the one FIREFOX_EXTENSION_ID names; the FIRST submission that creates
      # the listing is done by hand on the AMO Developer Hub.
      - name: Publish to addons.mozilla.org
        env:
          FIREFOX_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          FIREFOX_EXTENSION_ID: ${{ secrets.AMO_EXTENSION_ID }}
        working-directory: apps/extension
        run: |
          if [ -z "$FIREFOX_JWT_ISSUER" ] || [ -z "$FIREFOX_JWT_SECRET" ] || [ -z "$FIREFOX_EXTENSION_ID" ]; then
            echo "::notice::AMO_* secrets not configured; firefox zip attached to the GitHub release only."
            exit 0
          fi
          version="$(node -p "require('../../package.json').version")"
          bunx wxt submit \
            --firefox-zip "$(ls .output/*-"${version}"-firefox.zip)" \
            --firefox-sources-zip "$(ls .output/*-"${version}"-firefox-sources.zip)"
