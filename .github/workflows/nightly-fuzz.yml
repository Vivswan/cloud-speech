# Repo-owned: generated once by the fleet sync as a starter, never overwritten by it. The schedule runs the release
# gate (release-gate.yml, the same definition the release PR runs) and files or closes the fuzz issue on its result.
name: Nightly Fuzz

on:
  schedule:
    # This repository's own minute, so the fleet's nightlies do not all land on GitHub at once.
    - cron: "41 10 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: Fuzz seed (blank for a random one)
        required: false
        default: ""
      iterations:
        description: Fuzz iterations
        required: false
        default: "20000"

concurrency:
  group: nightly-fuzz
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-gate:
    uses: ./.github/workflows/release-gate.yml
    with:
      seed: ${{ inputs.seed }}
      iterations: ${{ inputs.iterations }}

  # Reports the gate's verdict whatever it was: a gate that hit its timeout reports cancelled, which counts as red.
  report:
    needs: [release-gate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # issues: write is for the fuzz-issue action; it assigns the owner itself at creation, so no actions: write for an auto-assign dispatch.
    permissions:
      contents: read
      issues: write
    steps:
      # The gate's own attempt named the artifact (release-gate.yml's fuzz-artifact output), so a re-run of this job
      # alone still downloads the reports of the attempt that produced them, and a gate that uploaded none downloads nothing.
      - name: Download failure artifacts
        if: needs.release-gate.outputs.fuzz-artifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.release-gate.outputs.fuzz-artifact }}
          path: ".fuzz-failures/"

      # always(): a failed download must not skip the report; the issue then carries the run link and no report bodies.
      - name: File or update the fuzz issue
        if: always() && contains(fromJSON('["failure","cancelled"]'), needs.release-gate.result)
        uses: Vivswan/repo-platform/actions/fuzz-issue@stable
        with:
          mode: report
          label: "fuzz-nightly"
          # Explicit though it matches the action's default: older renders rely on that default, so it can never change.
          title: Nightly fuzz failures
          artifacts-dir: .fuzz-failures
          artifact-name: ${{ needs.release-gate.outputs.fuzz-artifact }}
          label-color: "B60205"
          label-description: Automated nightly fuzz failure
          stream: fuzz

      - name: Close the fuzz issue on a green night
        if: needs.release-gate.result == 'success'
        uses: Vivswan/repo-platform/actions/fuzz-issue@stable
        with:
          mode: resolve
          label: "fuzz-nightly"
          stream: fuzz
