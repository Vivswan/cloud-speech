# Repo-owned: generated once by the fleet sync as a starter, never overwritten by it.
name: Nightly Fuzz

on:
  schedule:
    # This repository's own minute, so the fleet's nightlies do not all land on GitHub at once.
    - cron: "41 10 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: Fuzz seed (blank for a random one)
        required: false
        default: ""
      iterations:
        description: Fuzz iterations
        required: false
        default: "20000"

concurrency:
  group: nightly-fuzz
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    # issues: write is for the fuzz-issue action; it assigns the owner itself at creation, so no actions: write for an auto-assign dispatch.
    permissions:
      contents: read
      issues: write
    # A job that hits this timeout is CANCELLED, not failed, so the `if: failure()` steps below would never run;
    # the Fuzz step's FUZZ_TIMEOUT_MINUTES stays under it so a hang fails instead.
    timeout-minutes: 60
    # A shard matrix on this job would race the issue steps across shards; they must move to a `needs: fuzz` job
    # first (the fleet's docs/fuzzer.md).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies
        run: "bun install --frozen-lockfile"

      # A blank ITERATIONS (the cron, or a cleared dispatch input) takes the nightly budget here, not the runner's local default of 1000.
      # Anything else passes through untouched, so a malformed value fails the step instead of quietly meaning something.
      - name: Fuzz
        env:
          SEED: "${{ inputs.seed }}"
          ITERATIONS: "${{ inputs.iterations }}"
          FUZZ_TIMEOUT_MINUTES: "45"
        run: |
          case "$ITERATIONS" in
            *[![:space:]]*) ;;
            *) ITERATIONS="20000" ;;
          esac
          ITERATIONS="$ITERATIONS" bun run fuzz

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-failures-${{ github.run_attempt }}
          path: ".fuzz-failures/"
          # The directory is hidden; without this the upload silently skips it.
          include-hidden-files: true
          if-no-files-found: ignore

      - name: File or update the fuzz issue
        id: file-issue
        if: failure()
        uses: Vivswan/repo-platform/actions/fuzz-issue@build
        with:
          mode: report
          label: "fuzz-nightly"
          # Explicit though it matches the action's default: older renders rely on that default, so it can never change.
          title: Nightly fuzz failures
          artifacts-dir: .fuzz-failures
          artifact-name: fuzz-failures-${{ github.run_attempt }}

      - name: Close the fuzz issue on a green night
        if: success()
        uses: Vivswan/repo-platform/actions/fuzz-issue@build
        with:
          mode: resolve
          label: "fuzz-nightly"
