# Repo-owned: generated once by the fleet sync, never overwritten by it. The `fix-lint` label it listens for ships
# from the fleet's settings layer, not this repository's settings.yml.

name: Auto Format

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  format:
    # Same-repo PRs only: GITHUB_TOKEN cannot push to a fork's branch, and PR-controlled tool configuration must not
    # run next to write credentials (the checkout persists none; the push step scopes them).
    if: github.event.label.name == 'fix-lint' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # Install first so bunx resolves the workspace's pinned @biomejs/biome, the one checks.yml validates against.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format (biome)
        run: bunx biome check --write .

      - name: Commit and push changes
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet; then
            echo "nothing to format"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "style: apply automated formatting"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:"$HEAD_REF"
          fi
      # The label is a one-shot request: remove it even when a step failed, so a broken run cannot loop.
      - name: Remove the fix-lint label
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr edit "$PR_URL" --remove-label fix-lint
