# Repo-owned: generated once by the fleet sync, never overwritten by it. The GitHub Copilot coding agent finds the job
# below by name before working on the repository, so it MUST stay `copilot-setup-steps`; the push and pull_request
# triggers on this file alone let CI validate an edit to it.

name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 59
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install dependencies (bun)
        run: bun install --frozen-lockfile
