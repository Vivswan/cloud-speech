# This file is managed by Vivswan/repo-platform.
# Local edits are replaced on the next sync.
#
# The versioned Pages layout, the build contract (PAGES_BASE_PATH,
# PAGES_ORIGIN, PAGES_VERSION), and the CUSTOM_DOMAIN cutover:
# repo-platform's docs/pages.md. Pages is enabled by this module's settings
# layer on the next fleet settings apply; a deploy before that needs repo
# Settings -> Pages -> Source: GitHub Actions.
#
# The push deploy is ci.yml's `pages` job, downstream of the all-green
# gate with the judged commit (a red main never deploys); this workflow is
# the nightly rebuild and the manual dispatch, both building the default
# branch head. The called workflow reads the mounts and build commands
# from this repository's registration.
name: Pages

on:
  schedule:
    # Nightly rebuild: version tags created without a push land, and
    # central pipeline updates propagate (docs/pages.md).
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    uses: Vivswan/repo-platform/.github/workflows/reusable-pages.yml@build
    with:
      custom_domain: ${{ vars.CUSTOM_DOMAIN }}
    permissions:
      contents: read
      pages: write
      id-token: write
      issues: write
