# Repo-owned: generated once by the fleet sync, never overwritten by it. The managed ci.yml calls this inside the
# all-green gate, so every job here must pass; only repository-specific checks belong here (typography, yamllint,
# actionlint, spell check, and CodeQL run in the fleet CI).
#   secrets      -> none reach these jobs
#   permissions  -> capped at the caller's contents: read

name: Checks

on:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck (extension + web)
        run: bun run typecheck

      - name: Lint + format (biome, yaml quoting)
        run: bun run check

      - name: Test (with coverage thresholds)
        run: bun run test:coverage

      # The same suite under the firefox build flag, for the branches only that target takes (in-background audio host, UI variants).
      - name: Test (firefox build target)
        run: bun run test:firefox

      - name: Build + zip (chrome + firefox)
        run: bun run build:chrome && bun run build:firefox

      - name: Lint Firefox build (addons-linter)
        run: bun run lint:firefox

      # The same check update-release.yml runs before uploading, so a bad manifest fails the PR, not the release.
      - name: Verify store zips
        run: bun run verify:zips

      - name: Build website
        run: bun run build:web

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension-builds
          path: |
            apps/extension/.output/chrome-mv3/
            apps/extension/.output/firefox-mv3/
          if-no-files-found: error
          retention-days: 7

  e2e-smoke:
    name: e2e smoke (loaded extension)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install chromium --with-deps
        working-directory: apps/extension

      - name: Run extension UI smoke
        run: bun run test:e2e

  e2e-firefox:
    name: e2e smoke (Firefox event page)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # A stock Firefox: Playwright's Firefox cannot load extensions, so the suite drives this one through Selenium,
      # whose bundled Selenium Manager fetches the matching geckodriver (tests/e2e/firefox/fixtures.ts).
      - uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1.7.2
        with:
          firefox-version: latest

      # Firefox aborts audio-only playback when it finds no output device, and the runner has no sound server.
      - name: Start a PulseAudio null sink
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=e2e
          pactl set-default-sink e2e

      - name: Run Firefox extension smoke
        run: bun run test:e2e:firefox
        env:
          SE_AVOID_STATS: "true"
