# Repo-owned CI checks, called by the managed ci.yml inside the all-green
# gate: every job here must pass before all-green goes green. Generated once
# by Vivswan/repo-platform and never overwritten by template sync.
#
# Two limits from running inside the `checks` caller: jobs here get no
# secrets and are capped at the caller's permissions (contents: read);
# both jobs below need neither. Typography, yamllint, actionlint, commit
# names, and CodeQL run as managed jobs in ci.yml, so this file holds only
# what is specific to this repository.

name: Checks

on:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck (extension + web)
        run: bun run typecheck

      - name: Lint + format (biome, yaml quoting)
        run: bun run check

      - name: Test (with coverage thresholds)
        run: bun run test:coverage

      # Same suite with import.meta.env.FIREFOX = true; exercises the
      # firefox-only branches (in-background audio host, UI variants).
      - name: Test (firefox build target)
        run: bun run test:firefox

      # One chrome zip (published to both CWS listing IDs) + the firefox
      # zip; verify each zip's manifest (version, name, no dev key), the same
      # smoke the release runs.
      - name: Build + zip (chrome + firefox)
        run: bun run build:chrome && bun run build:firefox

      - name: Verify store zips
        run: bun run verify:zips

      - name: Build website
        run: bun run build:web

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: extension-builds
          path: |
            apps/extension/.output/chrome-mv3/
            apps/extension/.output/firefox-mv3/
          if-no-files-found: error
          retention-days: 7

  e2e-smoke:
    name: e2e smoke (loaded extension)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install chromium --with-deps
        working-directory: apps/extension

      # Loads the built extension into a real Chromium and drives the popup:
      # sidebar, Settings (4 providers + first-run), Preferences, Feedback,
      # then a full read/pause/resume/cancel flow against a fake
      # OpenAI-compatible server the spec starts on localhost (no keys).
      - name: Run extension UI smoke
        run: bun run test:e2e

  e2e-firefox:
    name: e2e smoke (Firefox event page)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # A stock Firefox: Playwright's Firefox cannot load extensions, so the
      # suite drives this one through Selenium, whose bundled Selenium
      # Manager fetches the matching geckodriver (e2e/firefox/fixtures.ts).
      - uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest

      # Firefox aborts audio-only playback when it finds no output device, and
      # the runner has no sound server; a PulseAudio null sink stands in.
      - name: Start a PulseAudio null sink
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=e2e
          pactl set-default-sink e2e

      # Loads the built Firefox extension as a temporary add-on and drives
      # the popup through the same read/pause/resume/cancel flow against the
      # fake OpenAI-compatible server, where the audio session runs inside
      # the background event page (no offscreen document).
      - name: Run Firefox extension smoke
        run: bun run test:e2e:firefox
        env:
          SE_AVOID_STATS: "true"
