# Repo-owned release pipeline, called by the managed ci.yml on top of the
# all-green gate. Generated once by Vivswan/repo-platform and never
# overwritten by template sync.
#
# GitHub releases are immutable once published: the tag and assets freeze,
# and a post-publication `gh release upload` gets HTTP 422. Every release
# therefore moves through the same three steps, always draft-first:
#   1. release-please cuts the release as a DRAFT with its tag already
#      forced (`draft` + `force-tag-creation` in release-please-config.json).
#   2. update-release mutates the draft: builds the chrome + firefox zips
#      from the TAG and attaches them (plus the AMO sources zip), then
#      publishes the SAME chrome zip to all three Chrome Web Store listing
#      IDs (the unified listing + the two legacy fork listings, kept updated
#      for backwards compatibility) and the firefox zip to
#      addons.mozilla.org, each skipped with a notice until its secrets are
#      configured.
#   3. publish-release flips the draft live. It stays the last job: list
#      every job that mutates the release in its `needs`.
# If the pipeline dies after the draft exists, a rerun cannot recreate it
# (release-please sees the forced tag); finish by hand:
#   gh release upload <tag> <assets> --clobber
#   gh release edit <tag> --draft=false
# Hand-uploaded assets carry no provenance attestation (attesting needs this
# workflow's OIDC identity), so `gh attestation verify` fails for releases
# finished this way.
#
# The website deploys separately via the managed pages.yml (the production
# root is rebuilt from the latest release tag on `release: published`).
# Manifest mode (.release-please-manifest.json) records the LAST RELEASED
# version (1.0.8, the final pre-rewrite Polly release). The rewrite's first
# commit carries a "Release-As: 2.0.0" footer to pin the major bump.
#
# The REPO_PLATFORM_TOKEN secret (a PAT) is required for the full flow, as
# RELEASE_PLEASE_TOKEN was before it: without a PAT the release PR gets no
# CI runs (so it cannot pass the required all-green check without a manual
# close/reopen), and releases published by the default GITHUB_TOKEN do not
# fire pages.yml's `release: published` trigger, leaving the website root on
# the previous release until the next push to main.

name: Release

on:
  workflow_call:

jobs:
  release-please:
    uses: ./.github/workflows/release-please.yml
    secrets: inherit

  # Step 2: mutate the draft. Add sibling jobs freely, as long as every job
  # that touches the release lands in publish-release's needs.
  update-release:
    name: build zips · upload · publish to store
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write # upload assets; also what makes the draft visible to gh
      # Build provenance for the zips (within the managed ci.yml ceiling,
      # which grants both).
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      # Build from the TAG, not the branch head: the artifacts must be exactly
      # the released source even if main moved on since.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build store zips (chrome + firefox)
        run: bun run build:chrome && bun run build:firefox

      - name: Verify store zips (version, name, no dev key)
        run: bun run verify:zips

      # Signed provenance for every zip this job uploads (chrome, firefox,
      # AMO sources): anyone can check an asset really came from this
      # workflow at this tag with `gh attestation verify <zip> -R <owner>/<repo>`.
      # Attestations require a public repository (private needs GitHub
      # Enterprise Cloud), so going private would fail every release here.
      - name: Attest build provenance for the zips
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: apps/extension/.output/*.zip

      - name: Upload zips to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          ls -la apps/extension/.output/*.zip
          gh release upload "$TAG" apps/extension/.output/*.zip --clobber

      # Publish the SAME chrome zip to all three Chrome Web Store listing IDs
      # via `wxt submit`: the unified "Cloud Speech" listing plus
      # the two legacy fork listings, kept updated for backwards
      # compatibility. One shared CWS OAuth app (client id/secret/refresh
      # token) + one extension-ID secret per listing. Skips with a notice
      # while the secrets are not configured, so releases keep working before
      # store automation is set up.
      # Docs: https://wxt.dev/guide/essentials/publishing
      - name: Publish to the Chrome Web Store (all listing IDs)
        env:
          CHROME_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_ID_CLOUD: ${{ secrets.CWS_EXTENSION_ID_CLOUD }}
          CWS_ID_POLLY: ${{ secrets.CWS_EXTENSION_ID_POLLY }}
          CWS_ID_AZURE: ${{ secrets.CWS_EXTENSION_ID_AZURE }}
        working-directory: apps/extension
        run: |
          if [ -z "$CHROME_CLIENT_ID" ] || [ -z "$CHROME_CLIENT_SECRET" ] || [ -z "$CHROME_REFRESH_TOKEN" ]; then
            echo "::notice::CWS_* secrets not fully configured; zips attached to the GitHub release only."
            exit 0
          fi
          version="$(node -p "require('../../package.json').version")"
          # Resolve by suffix glob: the filename pattern is written down only
          # in wxt.config.ts; verify:zips already asserted exactly one match.
          chrome_zip=$(ls .output/*-"${version}"-chrome.zip)
          for listing in cloud polly azure; do
            id_var="CWS_ID_$(echo "$listing" | tr '[:lower:]' '[:upper:]')"
            extension_id="${!id_var}"
            if [ -z "$extension_id" ]; then
              echo "::notice::No extension id secret for $listing; skipping that listing."
              continue
            fi
            echo "Publishing $listing listing ($extension_id)..."
            CHROME_EXTENSION_ID="$extension_id" \
              bunx wxt submit --chrome-zip "$chrome_zip"
          done

      # Publish the firefox zip (+ AMO-required sources zip) to
      # addons.mozilla.org. Skips with a notice until the AMO_* secrets exist;
      # the FIRST submission must be done by hand on the AMO Developer Hub
      # (listing creation), after which the API keys make this automatic.
      - name: Publish to addons.mozilla.org
        env:
          FIREFOX_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          FIREFOX_EXTENSION_ID: ${{ secrets.AMO_EXTENSION_ID }}
        working-directory: apps/extension
        run: |
          if [ -z "$FIREFOX_JWT_ISSUER" ] || [ -z "$FIREFOX_JWT_SECRET" ] || [ -z "$FIREFOX_EXTENSION_ID" ]; then
            echo "::notice::AMO_* secrets not configured; firefox zip attached to the GitHub release only."
            exit 0
          fi
          version="$(node -p "require('../../package.json').version")"
          bunx wxt submit \
            --firefox-zip "$(ls .output/*-"${version}"-firefox.zip)" \
            --firefox-sources-zip "$(ls .output/*-"${version}"-firefox-sources.zip)"

  # Step 3: freeze the release. This job stays last.
  publish-release:
    needs: [release-please, update-release]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release edit "$TAG" --draft=false
