# Repo-owned. Publishes the store-listing screenshots (docs/store-listing.md,
# "Screenshots") to the orphan `store-screenshots` branch after every green
# CI run of main, so the current sets are always at stable URLs:
# https://raw.githubusercontent.com/Vivswan/cloud-speech/store-screenshots/<locale>/<file>
# one directory per language the extension ships, and the English set at the
# root as well, where the set was published before there were several, so
# every URL that pointed there still resolves.
#
# The set is not rendered here: post-green.yml renders it inside the CI run
# and uploads it as the `store-screenshots-<sha>` artifact; this workflow
# copies that artifact onto the branch. It is a separate workflow because it
# publishes only once the WHOLE run, release leg included, has concluded
# green, which no job inside that run can observe; its own token carries the
# permissions below and needs no PAT. The branch never grows: every run
# replaces it with ONE commit, and refs/heads/store-screenshots is the only
# ref ever written (no ruleset covers it; every branch ruleset targets the
# default branch).

name: Publish Screenshots

on:
  # The job checks out nothing and runs no code from the triggering run: it copies one artifact of a green push run of main.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# One publish at a time and never a cancelled push (a pending run waits): a
# superseded set is replaced by the next run a minute later.
concurrency:
  group: publish-screenshots
  cancel-in-progress: false

jobs:
  publish:
    name: publish the store screenshots to the store-screenshots branch
    # Only a green PUSH run: CI's schedule and dispatch runs on main have no
    # post-green leg and so no artifact. A red run (a failed check, render,
    # or release leg) keeps the branch at the previous set.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the force-push to refs/heads/store-screenshots
      actions: read # the artifact belongs to another run
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: store-screenshots-${{ github.event.workflow_run.head_sha }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: store-screenshots

      # A fresh repository in the runner's temp dir holds the one commit; the
      # remote URL carries the run's token (masked in the log). `cp` fails on
      # an empty glob, so an artifact without the English set's JPEGs fails
      # the job before the push; the other sets are copied as the directories
      # they arrive in.
      - name: Push the sets as one commit to the store-screenshots branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          stage="$RUNNER_TEMP/store-screenshots-branch"
          trap 'rm -rf "$stage"' EXIT
          mkdir "$stage"
          for dir in store-screenshots/*/; do
            locale="$(basename "$dir")"
            mkdir "$stage/$locale"
            cp "$dir"*.jpg "$dir"crops.json "$stage/$locale/"
          done
          cp store-screenshots/en/*.jpg store-screenshots/en/crops.json "$stage"/
          cat > "$stage/README.md" <<EOF
          # Cloud Speech store screenshots

          The Chrome Web Store listing screenshots for Cloud Speech
          ($SERVER_URL/$REPOSITORY), rendered by CI from the built extension
          and the e2e fake speech server; no provider account is involved.

          - Rendered from commit $SHA ($SERVER_URL/$REPOSITORY/commit/$SHA)
          - Regenerated on every green push to main: post-green.yml runs
            "bun run screenshots:store" (apps/extension/tests/e2e/store-screenshots.ts)
            and publish-screenshots.yml replaces this branch with one commit
            holding the new sets, so the branch has no history.
          - Stable URL for a file:
            https://raw.githubusercontent.com/$REPOSITORY/store-screenshots/LOCALE/FILE

          Layout: one set per language the extension ships, in a directory
          named after the store's language code, and the English set at the
          root as well (where the set lived before there were several, so
          older URLs keep resolving):

          - en/, hi/, zh-CN/, zh-TW/: the sets, one directory each
          - SCENE.jpg and the rest at the root: the English set again

          Files in a set:

          - SCENE.jpg: 1280 x 800, the store upload, a focus crop of the composition
          - SCENE-2x.jpg: 2560 x 1600, the whole composition
          - crops.json: for each scene, where its store crop sits in the 2x
            image, in that image's pixels

          What each scene shows and how it is staged: docs/store-listing.md
          in the source repository.
          EOF
          git -C "$stage" init --quiet --initial-branch=store-screenshots
          git -C "$stage" config user.name "github-actions[bot]"
          git -C "$stage" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$stage" add --all
          git -C "$stage" commit --quiet -m "Store screenshots rendered from $SHA"
          git -C "$stage" push --force --quiet \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git" \
            HEAD:refs/heads/store-screenshots
