# Repo-owned: generated once by the fleet sync, never overwritten by it.

paths:
  .github/workflows/**/*.{yml,yaml}:
    ignore:
      # actionlint's permission-scope list lacks `vulnerability-alerts`, which GitHub does grant to GITHUB_TOKEN
      # (the release-health gate reads Dependabot alerts with it): rhysd/actionlint#666.
      - 'unknown permission scope "vulnerability-alerts"'
